<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ShadowQA Live · options</title>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      body { font: 13px/1.5 "Work Sans", system-ui, sans-serif; background: #1c1c1c; color: #f4f1ea; margin: 0; padding: 20px; width: 360px; }
      h1 { font-size: 11px; margin: 0 0 14px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
      h1::before { content: "◈ "; }
      label { display: block; font-size: 11px; color: #a9a59d; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.08em; }
      input { width: 100%; box-sizing: border-box; background: #232323; color: #f4f1ea; border: 1px solid rgba(244,241,234,0.2); border-radius: 3px; padding: 8px 10px; font: inherit; }
      button { margin-top: 16px; background: #f4f1ea; color: #1c1c1c; border: 0; border-radius: 3px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
      .row input { width: auto; }
      #status { color: #3dd68c; margin-left: 10px; }
      .hint { color: #6f6c66; font-size: 11px; margin-top: 14px; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </head>
  <body>
    <h1>ShadowQA Live</h1>
    <label for="bridgeUrl">Bridge URL</label>
    <input id="bridgeUrl" placeholder="http://localhost:8001/api/shadowqa" />
    <label for="token">Bridge token</label>
    <input id="token" type="password" placeholder="SHADOWQA_BRIDGE_TOKEN" />
    <label for="appName">Application name (optional)</label>
    <input id="appName" placeholder="My app" />
    <div class="row"><input id="enabled" type="checkbox" checked /><span>Enabled on matching local hosts</span></div>
    <button id="save">Save</button><span id="status"></span>
    <p class="hint">Start the bridge with <code>shadowqa live start</code>. Incidents appear in <code>shadowqa findings</code> and follow your project's automation mode.</p>
    <script src="options.js"></script>
  </body>
</html>
